name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # ШАГ 1: GoReleaser. 
      # Он создает релиз и заливает файлы. Но описание будет пустым (или дефолтным).
      # Мы НЕ передаем ему release-notes.md
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # ШАГ 2: Генерируем Changelog в файл (как у DO)
      - name: Generate Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
          outputFile: "release_notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ШАГ 3: Обновляем релиз текстом (как у DO)
      # Используем softprops/action-gh-release, чтобы "дописать" changelog в существующий релиз
      - name: Update Release with Notes
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_notes.md # На всякий случай прикладываем как файл
          body_path: release_notes.md # Читаем файл и вставляем текст в описание релиза
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}