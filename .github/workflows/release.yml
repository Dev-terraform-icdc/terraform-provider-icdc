name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # ---------------------------------------------------------
      # ШАГ 1: GoReleaser (ЗАПУСКАЕМ ПЕРВЫМ!)
      # Git еще чистый, поэтому ошибки не будет.
      # Мы убрали флаг --release-notes, описание пока будет пустым.
      # ---------------------------------------------------------
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # ---------------------------------------------------------
      # ШАГ 2: Генерируем текст (Уже не важно, что git dirty)
      # ---------------------------------------------------------
      - name: Generate Changelog
        uses: mikepenz/release-changelog-builder-action@v4
        id: build_changelog
        with:
          configuration: ".github/changelog-config.json"
          outputFile: "release_notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # ШАГ 3: Заливаем текст в релиз
      # Этот шаг находит релиз по тегу и обновляет ему описание
      # ---------------------------------------------------------
      - name: Update Release Body
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}name: release
